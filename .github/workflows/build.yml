name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile, n8n-task-runners.json, .github/workflows/build.yml]
  workflow_dispatch:

env:
  # Must equal the n8n version deployed in homelab-v3 (core/n8n/app.yaml).
  N8N_VERSION: "2.44.7"
  IMAGE: ghcr.io/debugger24/n8n-runners

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: N8N_VERSION=${{ env.N8N_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.N8N_VERSION }}
          push: true
